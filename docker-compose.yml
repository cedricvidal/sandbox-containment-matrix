# Runs the MXC experiment inside a Linux container, where MXC uses the
# `bubblewrap` backend.
#
#   docker compose run --rm mxc              # works: minimum viable config
#   docker compose run --rm mxc-stock        # fails: stock container hardening
#   docker compose run --rm mxc-privileged   # works: sledgehammer fallback
#
# Override the command to run another entry point:
#   docker compose run --rm mxc pnpm probe
#
# If npmjs.org is unreachable from your build network (corporate proxy), build
# with an explicit registry:
#   docker compose build --build-arg NPM_REGISTRY=https://your-proxy/npm/ mxc

x-mxc-base: &mxc-base
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
  image: sandbox-mxc-sdk-typescript:latest
  init: true
  devices:
    # slirp4netns needs /dev/net/tun to build the private network namespace
    # that schema 0.8 per-CIDR egress rules are enforced in. Without it those
    # policies fail closed: `open("/dev/net/tun"): No such file or directory`.
    - /dev/net/tun

services:
  # Minimum that lets bwrap build its namespace. Notably NOT privileged and with
  # no added capabilities — see the README for why each option is needed.
  mxc:
    <<: *mxc-base
    security_opt:
      # SELinux denies bwrap's devpts mount inside the container.
      - label=disable
      # On Ubuntu 24.04 + Docker Engine the docker-default AppArmor profile
      # blocks bwrap's unprivileged user namespace even after the host sysctl is
      # lifted; unconfining it is the AppArmor analogue of label=disable. Not
      # needed under Podman/Debian. See docs/findings.md §23.
      - apparmor=unconfined
      # Docker/Podman mask parts of /proc; the kernel then refuses to let a
      # nested namespace mount its own proc. `systempaths=unconfined` clears the
      # masked + read-only /proc paths and — unlike Podman's `unmask=ALL` — is
      # accepted by both Docker and Podman (see docs/findings.md §23).
      - systempaths=unconfined

  # MXC expresses no CPU/memory limits, so resource containment has to come
  # from the container's cgroup. This profile adds what MXC cannot.
  mxc-limits:
    <<: *mxc-base
    security_opt:
      - label=disable
      - apparmor=unconfined
      - systempaths=unconfined
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 128

  # Bounds the untrusted side WITHOUT suffocating the trusted one.
  #
  # cpuset_cpus bounds total CPU by hardware rather than by quota, and the
  # sandbox is pinned away from the first CPU (runInSandbox's reserveHostCpu),
  # leaving it for the orchestrator. Unlike `cpus:`, a cgroup quota that
  # throttles both sides alike, this discriminates between them.
  # See docs/findings.md §16.
  mxc-reserved:
    <<: *mxc-base
    security_opt:
      - label=disable
      - apparmor=unconfined
      - systempaths=unconfined
    cpuset: "0-3"
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256

  # Stock container hardening — kept to demonstrate the failure mode.
  mxc-stock:
    <<: *mxc-base

  # Full privileges. Also works, but grants far more than MXC needs.
  mxc-privileged:
    <<: *mxc-base
    privileged: true
